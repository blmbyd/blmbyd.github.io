name: Create PDF

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate PDF from (defaults to the selected branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-pdf:
    name: Build and export PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validates every src/data/*.yaml file against its schema as a side effect.
      - name: Build the site
        run: npm run build

      - name: Install Chromium for PDF rendering
        run: npx playwright install --with-deps chromium

      - name: Render cv.pdf
        run: npm run pdf

      - name: Check the PDF margins
        run: npm run verify:pdf

      - name: Add branch suffix to the PDF filename
        id: pdf-file
        env:
          PDF_BRANCH: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, renameSync } from 'node:fs';

          const branch = process.env.PDF_BRANCH.replace(/[^a-zA-Z0-9._-]+/g, '-');
          const path = `dist/cv-${branch}.pdf`;
          renameSync('dist/cv.pdf', path);
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${path}\n`);
          NODE

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pdf-file.outputs.path }}
          archive: false
          if-no-files-found: error
