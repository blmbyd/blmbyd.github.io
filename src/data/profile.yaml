summary:
  # A plain string prints. An entry written as "text: ..." stays on the web page
  # but is left out of the printed CV and the PDF.
  - >-
    My work sits where technology, business and customer success overlap: consultative
    technical pre-sales, solution architecture and technical leadership for organisations
    adopting GitHub. Working alongside account teams, I take customers from executive
    briefings, technical discovery and live product demonstrations through solution
    shaping, implementation, adoption and measurable outcomes.
  - >-
    I help organisations modernise software delivery on GitHub — GitHub Enterprise,
    GitHub Actions, GitHub Advanced Security and GitHub Copilot — translating business and
    engineering requirements into the solution architecture, governance, security and
    operating models that let DevOps, DevSecOps and AI-assisted development scale.
  - >-
    A large part of that is migration architecture and delivery. I lead enterprise moves
    onto GitHub from Azure DevOps, GitLab and Bitbucket end to end — assessment,
    migration design, pilot waves, cutover and the adoption work afterwards that decides
    whether the move actually holds.
  - >-
    I also build enablement that outlasts a single engagement — customer training
    programmes and workshops, hands-on workshop repositories and internal champion work
    that help customer teams and colleagues apply GitHub and GitHub Copilot practices on
    their own.
  - text: >-
      Most of my time goes to engineering leaders, architects and platform teams —
      understanding what actually slows them down, designing practical transformation
      roadmaps, and showing how a modern developer platform improves collaboration,
      automation, governance and throughput.
  - text: >-
      Outside customer engagements I speak at conferences, webinars and community events
      on DevOps, developer experience, AI-powered development and modern software
      engineering — including GitHub Copilot agentic workflows and security-first
      development with GitHub.

# A short, human line that sits under the "Beyond the desk" heading.
personalNote: >-
  I started out as a toolmaker before I ever wrote production code, and that habit of
  taking things apart to understand them never really went away.
