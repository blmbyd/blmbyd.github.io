summary:
  # A plain string prints. An entry written as "text: ..." stays on the web page
  # but is left out of the printed CV and the PDF.
  - >-
    I help enterprise organisations modernise software delivery on GitHub — GitHub
    Enterprise, GitHub Actions, GitHub Advanced Security and GitHub Copilot — designing
    the solution architecture, governance, security and operating models that let DevOps
    modernisation, developer productivity and AI-assisted engineering scale.
  - >-
    A large part of that is migration architecture and delivery. I lead enterprise moves
    onto GitHub end to end — assessment, migration design, pilot waves, cutover and the
    adoption work afterwards that decides whether the move actually holds.
  - >-
    My work sits where technology, business and customer success overlap: technical
    leadership, solution architecture and consultative pre-sales, guiding organisations
    from executive briefings, technical discovery and assessments through solution
    shaping, implementation, adoption and measurable outcomes.
  - >-
    I also build enablement that outlasts a single engagement — training programmes,
    hands-on workshop repositories and internal champion work that help colleagues and
    customer teams apply GitHub and GitHub Copilot practices on their own.
  - text: >-
      Most of my time goes to engineering leaders, architects and platform teams —
      understanding what actually slows them down, designing practical transformation
      roadmaps, and showing how a modern developer platform improves collaboration,
      automation, governance and throughput.
  - text: >-
      Outside customer engagements I speak at conferences, webinars and community events
      on DevOps, developer experience, AI-powered development and modern software
      engineering — including GitHub Copilot agentic workflows and security-first
      development with GitHub.

# A short, human line that sits under the "Beyond the desk" heading.
